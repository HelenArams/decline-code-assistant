[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decline-code-assistant"
version = "0.1.0"
description = "Agent that explains card transaction declines and proposes next actions, grounded in a curated knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Helen Aramyan" }]
keywords = ["payments", "iso8583", "declines", "langgraph", "anthropic", "mcp", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "anthropic==0.84.0",
  "langgraph==1.0.10",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "typer==0.24.1",
  "rich==14.3.3",
  "mcp==1.26.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.4",
  "mypy==1.19.1",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
declines = "decline_assistant.cli:app"
declines-mcp = "decline_assistant.mcp_server:main"

[project.urls]
Homepage = "https://github.com/HelenArams/decline-code-assistant"
Issues = "https://github.com/HelenArams/decline-code-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decline_assistant = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["decline_assistant"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langgraph.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -ra"
filterwarnings = ["error::DeprecationWarning:decline_assistant.*"]
